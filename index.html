<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Code Separator v2.2 - Final Fix</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; font-family: 'Fredoka', sans-serif; }
        body { 
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            margin: 0; padding: 20px; display: flex; justify-content: center; min-height: 100vh;
        }
        .main-wrapper { max-width: 1000px; width: 100%; }
        .container { 
            background: rgba(255, 255, 255, 0.98); padding: 30px; border-radius: 40px; 
            box-shadow: 0 25px 50px rgba(0,0,0,0.2); border: 8px solid #fff;
        }
        h1 { color: #6c5ce7; text-align: center; margin-bottom: 5px; text-transform: uppercase; letter-spacing: -1px; }
        .status-bar { text-align: center; font-size: 12px; color: #27ae60; margin-bottom: 20px; font-weight: bold; }
        
        textarea { 
            width: 100%; height: 180px; padding: 20px; border-radius: 25px; border: 3px solid #eee;
            font-size: 15px; outline: none; margin-bottom: 15px; resize: vertical; transition: 0.3s;
            background: #fdfdfd;
        }
        textarea:focus { border-color: #6c5ce7; background: #fff; box-shadow: 0 5px 15px rgba(0,0,0,0.05); }

        .action-bars { display: flex; gap: 10px; margin-bottom: 30px; flex-wrap: wrap; }
        .btn { 
            flex: 1; padding: 15px; border: none; border-radius: 15px; cursor: pointer; 
            font-size: 14px; font-weight: bold; transition: 0.2s; color: white;
            min-width: 140px; text-transform: uppercase;
        }
        .btn-process { background: #6c5ce7; box-shadow: 0 6px 0 #4834d4; }
        .btn-json { background: #f1c40f; color: #2d3436; box-shadow: 0 6px 0 #d4ac0d; }
        .btn-copy-raw { background: #00b894; box-shadow: 0 6px 0 #00876c; }
        .btn-clear { background: #ff4757; box-shadow: 0 6px 0 #b33939; }
        
        .btn:active { transform: translateY(4px); box-shadow: 0 2px 0 rgba(0,0,0,0.2); }

        .output-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
        @media (max-width: 768px) { .output-grid { grid-template-columns: 1fr; } }

        .box { background: #f1f2f6; border-radius: 25px; padding: 20px; border: 1px solid #ddd; position: relative; }
        .full-width { grid-column: 1 / -1; background: #ebf3ff; border: 2px dashed #6c5ce7; }
        
        .box-title { 
            font-size: 14px; font-weight: bold; color: #6c5ce7; margin-bottom: 12px; 
            display: flex; justify-content: space-between; align-items: center; 
        }
        .copy-small { 
            background: #6c5ce7; color: white; border: none; padding: 8px 15px; 
            border-radius: 12px; font-size: 11px; cursor: pointer; font-weight: bold;
        }

        .display-area { 
            background: #fff; border-radius: 15px; padding: 15px; border: 1px solid #eee; 
            height: 300px; overflow-y: auto; font-size: 13px; white-space: pre-wrap;
            font-family: 'Courier New', Courier, monospace; color: #333; line-height: 1.6;
        }
        .json-mode { color: #2e86de; font-weight: bold; height: 400px; }
        .text-mode { font-family: 'Fredoka', sans-serif !important; font-size: 14px; }
        .success-bg { border: 2px solid #27ae60 !important; }
        .error-bg { border: 2px solid #e74c3c !important; }
    </style>
</head>
<body>

<div class="main-wrapper">
    <div class="container">
        <h1>Code Separator ✂️</h1>
        <div id="status-tag" class="status-bar">STATUS: READY (v2.2)</div>
        
        <textarea id="raw-input" placeholder="Paste respon AI kat sini..."></textarea>
        
        <div class="action-bars">
            <button id="main-process" class="btn btn-process">ASINGKAN KOD 🚀</button>
            <button id="main-json" class="btn btn-json">KEMAS JSON ✨</button>
            <button id="main-copy-raw" class="btn btn-copy-raw">SALIN ASAL 📋</button>
            <button id="main-clear" class="btn btn-clear">PADAM SEMUA 🗑️</button>
        </div>

        <div class="output-grid">
            <div class="box">
                <div class="box-title">
                    <span>CLEAN CODE 💎</span>
                    <button id="copy-code-btn" class="copy-small">COPY CODE</button>
                </div>
                <div id="code-output" class="display-area">Kod akan muncul di sini...</div>
            </div>

            <div class="box">
                <div class="box-title">
                    <span>NORMAL TEXT 💬</span>
                    <button id="copy-text-btn" class="copy-small">COPY TEXT</button>
                </div>
                <div id="text-output" class="display-area text-mode">Teks akan muncul di sini...</div>
            </div>

            <div class="box full-width">
                <div class="box-title">
                    <span id="json-label">JSON MEGA REPAIR 📂</span>
                    <button id="copy-json-btn" class="copy-small" style="background: #27ae60;">COPY JSON</button>
                </div>
                <div id="json-output" class="display-area json-mode">Hasil repair JSON akan muncul di sini...</div>
            </div>
        </div>
    </div>
</div>

<script>
    // Universal Copy Function
    function executeCopy(textToCopy, buttonElement) {
        if (!textToCopy || textToCopy.includes("akan muncul di sini")) return;

        const textArea = document.createElement("textarea");
        textArea.value = textToCopy;
        document.body.appendChild(textArea);
        textArea.select();
        
        try {
            document.execCommand('copy');
            const originalText = buttonElement.innerText;
            buttonElement.innerText = "COPIED! ✅";
            buttonElement.style.background = "#2ecc71";
            setTimeout(() => {
                buttonElement.innerText = originalText;
                buttonElement.style.background = "";
            }, 1500);
        } catch (err) {
            alert("Gagal copy!");
        }
        document.body.removeChild(textArea);
    }

    // Main App Logic
    window.onload = function() {
        const inputArea = document.getElementById('raw-input');
        const codeDisplay = document.getElementById('code-output');
        const textDisplay = document.getElementById('text-output');
        const jsonDisplay = document.getElementById('json-output');

        // 1. Tombol Asingkan Kod
        document.getElementById('main-process').onclick = function() {
            const val = inputArea.value.trim();
            if(!val) return alert("Sila paste kod dulu!");

            // Split by markdown backticks
            const parts = val.split(/(```[\s\S]*?```)/g);
            let codes = [];
            let texts = [];

            parts.forEach(part => {
                if (part.startsWith('```')) {
                    let clean = part.replace(/^```[a-zA-Z]*\n?/, '').replace(/```$/, '').trim();
                    codes.push(clean);
                } else if(part.trim()) {
                    // Cek kalau ada HTML naked
                    if (part.includes('<!DOCTYPE') || (part.includes('<html') && part.includes('</html>'))) {
                        codes.push(part.trim());
                    } else {
                        texts.push(part.trim());
                    }
                }
            });

            codeDisplay.innerText = codes.length > 0 ? codes.join("\n\n/* --- NEXT BLOCK --- */\n\n") : "Tiada kod ditemui.";
            textDisplay.innerText = texts.length > 0 ? texts.join("\n\n") : "Tiada teks ditemui.";
            document.getElementById('status-tag').innerText = "STATUS: EXTRACTION SUCCESS! ✅";
        };

        // 2. Tombol Kemas JSON
        document.getElementById('main-json').onclick = function() {
            const val = inputArea.value.trim();
            if(!val) return alert("Input kosong!");

            let clean = val.replace(/```[a-zA-Z]*\n?/g, '').replace(/```/g, '').trim();

            try {
                let repaired = clean
                    .replace(/\/\*[\s\S]*?\*\/|([^\\:]|^)\/\/.*$/gm, '$1') // Buang komen
                    .replace(/['’‘]/g, '"') // Tukar quotes
                    .replace(/,\s*([\]}])/g, '$1') // Trailing commas
                    .replace(/([{,]\s*)([a-zA-Z0-9_]+?)\s*:/g, '$1"$2":') // Quote keys
                    .replace(/\}\s*\{/g, '},{'); // Multi-object

                if (repaired.includes('},{') && !repaired.startsWith('[')) repaired = '[' + repaired + ']';

                const obj = JSON.parse(repaired);
                jsonDisplay.innerText = JSON.stringify(obj, null, 2);
                jsonDisplay.className = "display-area json-mode success-bg";
                document.getElementById('json-label').innerText = "JSON MEGA REPAIR: ✅ BERJAYA";
            } catch (e) {
                jsonDisplay.innerText = "Error: " + e.message;
                jsonDisplay.className = "display-area json-mode error-bg";
                document.getElementById('json-label').innerText = "JSON MEGA REPAIR: ❌ GAGAL";
            }
        };

        // 3. Tombol Salin (Semua Butang Copy)
        document.getElementById('main-copy-raw').onclick = function() {
            executeCopy(inputArea.value, this);
        };

        document.getElementById('copy-code-btn').onclick = function() {
            executeCopy(codeDisplay.innerText, this);
        };

        document.getElementById('copy-text-btn').onclick = function() {
            executeCopy(textDisplay.innerText, this);
        };

        document.getElementById('copy-json-btn').onclick = function() {
            executeCopy(jsonDisplay.innerText, this);
        };

        // 4. Tombol Clear
        document.getElementById('main-clear').onclick = function() {
            if(confirm("Betul ke nak kosongkan semua?")) location.reload();
        };
    };
</script>
</body>
</html>
