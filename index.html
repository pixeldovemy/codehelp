<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Multi-Separator v5.8 - JSON Surgeon</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; font-family: 'Fredoka', sans-serif; }
        body { background: #f0f2f5; margin: 0; padding: 20px; }
        .wrapper { max-width: 1400px; margin: 0 auto; background: white; padding: 25px; border-radius: 30px; box-shadow: 0 15px 35px rgba(0,0,0,0.1); }
        .nav-tabs { display: flex; gap: 15px; margin-bottom: 25px; border-bottom: 3px solid #eee; padding-bottom: 15px; }
        .nav-btn { flex: 1; padding: 15px; border: none; border-radius: 15px; cursor: pointer; font-weight: bold; font-size: 16px; transition: 0.3s; background: #dfe6e9; color: #636e72; }
        .nav-btn.active { background: #6c5ce7; color: white; }
        .mode-content { display: none; }
        .mode-content.active { display: block; }
        h2 { color: #6c5ce7; margin-top: 0; font-size: 22px; margin-bottom: 15px; }
        .btn-row { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
        .btn { padding: 12px 25px; border: none; border-radius: 12px; cursor: pointer; font-weight: bold; color: white; transition: 0.2s; font-size: 13px; }
        .btn-action { background: #6c5ce7; border-bottom: 4px solid #4834d4; }
        .btn-clear { background: #ff4757; border-bottom: 4px solid #b33939; }
        .btn-copy { background: #00b894; border-bottom: 4px solid #00876c; }
        textarea { width: 100%; height: 550px; padding: 15px; border-radius: 15px; border: 2px solid #eee; background: #f9f9f9; font-family: 'Courier New', monospace; font-size: 12px; color: #2d3436; line-height: 1.5; outline: none; resize: none; }
        #json-status { font-size: 12px; font-weight: bold; margin-bottom: 10px; display: block; }
        .status-ok { color: #27ae60; }
        .status-err { color: #e74c3c; }
    </style>
</head>
<body>

<div class="wrapper">
    <div class="nav-tabs">
        <button id="tab-ext-btn" class="nav-btn active">1. EXTRACTION MODE ✂️</button>
        <button id="tab-beau-btn" class="nav-btn">2. BEAUTIFY MODE ✨</button>
    </div>

    <div id="page-extraction" class="mode-content active">
        <h2>HTML Hunter & Text Extractor</h2>
        <div class="btn-row">
            <button id="btn-run-ext" class="btn btn-action">ASINGKAN SEKARANG 🚀</button>
            <button id="btn-clear-ext" class="btn btn-clear">PADAM SEMUA 🗑️</button>
            <button id="btn-copy-html" class="btn btn-copy">COPY HTML 🌐</button>
            <button id="btn-copy-text" class="btn btn-copy">COPY TEXT 💬</button>
        </div>
        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px;">
            <textarea id="input-ext" placeholder="Paste respon AI kat sini..."></textarea>
            <textarea id="out-html" readonly placeholder="Kod HTML akan muncul..."></textarea>
            <textarea id="out-text" readonly style="font-family: 'Fredoka';" placeholder="Teks akan muncul..."></textarea>
        </div>
    </div>

    <div id="page-beautify" class="mode-content">
        <h2>JSON Ultra-Surgeon 5.8 (Deep Clean)</h2>
        <div class="btn-row">
            <button id="btn-run-beau" class="btn btn-action" style="background: #e17055; border-bottom: 4px solid #b33939;">FORCE REPAIR & BEAUTIFY ✨</button>
            <button id="btn-clear-beau" class="btn btn-clear">PADAM SEMUA 🗑️</button>
            <button id="btn-copy-json" class="btn btn-copy">COPY JSON 📂</button>
        </div>
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
            <textarea id="input-beau" placeholder="Paste JSON 'kotor' (double quotes) kat sini..."></textarea>
            <div class="column" style="display: flex; flex-direction: column;">
                <span id="json-status">Status: Sedia menerima input...</span>
                <textarea id="out-json" readonly style="color: #0984e3; font-weight: bold;" placeholder="Hasil repair akan muncul..."></textarea>
            </div>
        </div>
    </div>
</div>

<script>
document.addEventListener("DOMContentLoaded", function() {
    // TABS
    const tabExtBtn = document.getElementById('tab-ext-btn');
    const tabBeauBtn = document.getElementById('tab-beau-btn');
    const pageExt = document.getElementById('page-extraction');
    const pageBeau = document.getElementById('page-beautify');

    tabExtBtn.onclick = () => { tabExtBtn.classList.add('active'); tabBeauBtn.classList.remove('active'); pageExt.classList.add('active'); pageBeau.classList.remove('active'); };
    tabBeauBtn.onclick = () => { tabBeauBtn.classList.add('active'); tabExtBtn.classList.remove('active'); pageBeau.classList.add('active'); pageExt.classList.remove('active'); };

    // EXTRACTION
    document.getElementById('btn-run-ext').onclick = () => {
        const raw = document.getElementById('input-ext').value;
        const htmlRegex = /<!DOCTYPE html>[\s\S]*?<\/html>/gi;
        const htmlMatches = raw.match(htmlRegex);
        document.getElementById('out-html').value = htmlMatches ? htmlMatches.join("\n\n") : "Tiada HTML.";
        document.getElementById('out-text').value = raw.replace(htmlRegex, "").trim();
    };

    // --- JSON NUCLEAR SURGEON 5.8 ---
    document.getElementById('btn-run-beau').onclick = () => {
        const rawInput = document.getElementById('input-beau').value.trim();
        const status = document.getElementById('json-status');
        const output = document.getElementById('out-json');

        if(!rawInput) return alert("Sila masukkan data!");

        try {
            // STEP 1: GLOBAL CLEANING
            let str = rawInput
                .replace(/""/g, '"') // Tukar "" ke "
                .replace(/[\u201C\u201D\u2018\u2019]/g, '"') // Fix smart quotes
                .trim();

            // STEP 2: STRIP WRAPPING QUOTES (Kalau start/end dengan ")
            if (str.startsWith('"') && str.endsWith('"')) {
                str = str.substring(1, str.length - 1).trim();
            }

            // STEP 3: FIND PURE JSON BOUNDARIES (Greedy Search)
            const firstBrace = str.indexOf('{');
            const firstBracket = str.indexOf('[');
            const startIdx = (firstBrace === -1) ? firstBracket : (firstBracket === -1) ? firstBrace : Math.min(firstBrace, firstBracket);
            
            const lastBrace = str.lastIndexOf('}');
            const lastBracket = str.lastIndexOf(']');
            const endIdx = Math.max(lastBrace, lastBracket);

            if (startIdx === -1 || endIdx === -1) {
                throw new Error("Tiada struktur JSON { } atau [ ] ditemui.");
            }

            // Potong ambil zon JSON sahaja
            let jsonBody = str.substring(startIdx, endIdx + 1);

            // STEP 4: REPAIR INTERNAL ISSUES
            jsonBody = jsonBody
                .replace(/}\s*{/g, '},{') // Tambah koma antara object
                .replace(/,\s*([\]}])/g, '$1') // Buang trailing commas
                .replace(/([{,]\s*)([a-zA-Z0-9_]+?)\s*:/g, '$1"$2":'); // Quote keys yang bogel

            // STEP 5: AUTO-WRAP IF MULTIPLE OBJECTS (Bukan array tapi banyak object)
            if (jsonBody.startsWith('{') && jsonBody.includes('},{') && !jsonBody.endsWith(']')) {
                jsonBody = '[' + jsonBody + ']';
            }

            // FINAL PARSE
            const obj = JSON.parse(jsonBody);
            output.value = JSON.stringify(obj, null, 2);
            status.innerText = "Status: ✅ DEEP REPAIR BERJAYA!";
            status.className = "status-ok";
        } catch (e) {
            output.value = "❌ GAGAL TOTAL\n------------------\n" + e.message + "\n\nData ini sangat kotor. Sila pastikan anda tidak tersalah copy dari AI.";
            status.innerText = "Status: ❌ RALAT KRITIKAL";
            status.className = "status-err";
        }
    };

    // CLEAR & COPY
    document.getElementById('btn-clear-ext').onclick = () => { document.getElementById('input-ext').value = ""; document.getElementById('out-html').value = ""; document.getElementById('out-text').value = ""; };
    document.getElementById('btn-clear-beau').onclick = () => { document.getElementById('input-beau').value = ""; document.getElementById('out-json').value = ""; status.innerText = "Status: Sedia..."; };
    document.getElementById('btn-copy-json').onclick = () => { const el = document.getElementById('out-json'); el.select(); document.execCommand('copy'); alert("Copied!"); };
});
</script>
</body>
</html>
