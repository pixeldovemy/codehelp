<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Multi-Separator v5.6 - JSON Ultra-Surgeon</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; font-family: 'Fredoka', sans-serif; }
        body { background: #f0f2f5; margin: 0; padding: 20px; }
        .wrapper { max-width: 1400px; margin: 0 auto; background: white; padding: 25px; border-radius: 30px; box-shadow: 0 15px 35px rgba(0,0,0,0.1); }

        .nav-tabs { display: flex; gap: 15px; margin-bottom: 25px; border-bottom: 3px solid #eee; padding-bottom: 15px; }
        .nav-btn {
            flex: 1; padding: 15px; border: none; border-radius: 15px; cursor: pointer;
            font-weight: bold; font-size: 16px; transition: 0.3s; background: #dfe6e9; color: #636e72;
        }
        .nav-btn.active { background: #6c5ce7; color: white; }

        .mode-content { display: none; }
        .mode-content.active { display: block; }

        h2 { color: #6c5ce7; margin-top: 0; font-size: 22px; margin-bottom: 15px; }

        .btn-row { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
        .btn {
            padding: 12px 25px; border: none; border-radius: 12px; cursor: pointer;
            font-weight: bold; color: white; transition: 0.2s; font-size: 13px;
        }
        .btn-action { background: #6c5ce7; border-bottom: 4px solid #4834d4; }
        .btn-clear { background: #ff4757; border-bottom: 4px solid #b33939; }
        .btn-copy { background: #00b894; border-bottom: 4px solid #00876c; }
        .btn-download { background: #0984e3; border-bottom: 4px solid #074b81; }
        .btn:active { transform: translateY(2px); border-bottom-width: 2px; }

        .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 20px; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }

        @media (max-width: 1000px) { .grid-3, .grid-2 { grid-template-columns: 1fr; } }

        .column { display: flex; flex-direction: column; }
        .label { font-size: 13px; font-weight: bold; color: #6c5ce7; margin-bottom: 8px; text-transform: uppercase; }

        textarea.out-area {
            width: 100%; height: 550px; padding: 15px; border-radius: 15px; border: 2px solid #eee;
            background: #f9f9f9; font-family: 'Courier New', monospace; font-size: 12px;
            color: #2d3436; line-height: 1.5; outline: none; resize: none;
        }
        textarea.out-area:focus { border-color: #6c5ce7; background: #fff; }
        
        #json-status { font-size: 12px; font-weight: bold; margin-bottom: 10px; display: block; }
        .status-ok { color: #27ae60; }
        .status-err { color: #e74c3c; }
    </style>
</head>
<body>

<div class="wrapper">
    <div class="nav-tabs">
        <button id="tab-ext-btn" class="nav-btn active">1. EXTRACTION MODE ✂️</button>
        <button id="tab-beau-btn" class="nav-btn">2. BEAUTIFY MODE ✨</button>
    </div>

    <!-- EXTRACTION MODE -->
    <div id="page-extraction" class="mode-content active">
        <h2>HTML Hunter & Text Extractor (v5.6)</h2>
        <div class="btn-row">
            <button id="btn-run-ext" class="btn btn-action">ASINGKAN SEKARANG 🚀</button>
            <button id="btn-clear-ext" class="btn btn-clear">PADAM SEMUA 🗑️</button>
            <button id="btn-download-html" class="btn btn-download">DOWNLOAD .HTML 📥</button>
            <button id="btn-copy-html" class="btn btn-copy">COPY HTML 🌐</button>
            <button id="btn-copy-text" class="btn btn-copy">COPY TEXT 💬</button>
        </div>

        <div class="grid-3">
            <div class="column">
                <span class="label">Original Input</span>
                <textarea id="input-ext" style="height: 550px;" placeholder="Paste respon AI kat sini..."></textarea>
            </div>
            <div class="column">
                <span class="label">Pure HTML Code (Page)</span>
                <textarea id="out-html" class="out-area" readonly placeholder="Kod HTML akan muncul di sini..."></textarea>
            </div>
            <div class="column">
                <span class="label">Normal Text (Exclusion)</span>
                <textarea id="out-text" class="out-area" readonly style="font-family: 'Fredoka', sans-serif;" placeholder="Penerangan AI akan muncul di sini..."></textarea>
            </div>
        </div>
    </div>

    <!-- BEAUTIFY MODE -->
    <div id="page-beautify" class="mode-content">
        <h2>JSON Ultra-Surgeon & Beautify</h2>
        <div class="btn-row">
            <button id="btn-run-beau" class="btn btn-action" style="background: #e17055; border-bottom: 4px solid #b33939;">REPAIR & BEAUTIFY ✨</button>
            <button id="btn-clear-beau" class="btn btn-clear">PADAM SEMUA 🗑️</button>
            <button id="btn-copy-json" class="btn btn-copy">COPY JSON 📂</button>
        </div>

        <div class="grid-2">
            <div class="column">
                <span class="label">Original JSON Input</span>
                <textarea id="input-beau" style="height: 550px;" placeholder="Paste JSON (cth ada koma di hujung) kat sini..."></textarea>
            </div>
            <div class="column">
                <span class="label">Beautified & Repaired Code</span>
                <span id="json-status">Status: Menunggu input...</span>
                <textarea id="out-json" class="out-area" readonly style="color: #0984e3; font-weight: bold;" placeholder="Hasil repair akan muncul di sini..."></textarea>
            </div>
        </div>
    </div>
</div>

<script>
document.addEventListener("DOMContentLoaded", function() {
    const tabExtBtn = document.getElementById('tab-ext-btn');
    const tabBeauBtn = document.getElementById('tab-beau-btn');
    const pageExt = document.getElementById('page-extraction');
    const pageBeau = document.getElementById('page-beautify');

    tabExtBtn.addEventListener('click', () => {
        tabExtBtn.classList.add('active'); tabBeauBtn.classList.remove('active');
        pageExt.classList.add('active'); pageBeau.classList.remove('active');
    });

    tabBeauBtn.addEventListener('click', () => {
        tabBeauBtn.classList.add('active'); tabExtBtn.classList.remove('active');
        pageBeau.classList.add('active'); pageExt.classList.remove('active');
    });

    document.querySelectorAll('.out-area').forEach(area => {
        area.addEventListener('click', function() { this.select(); });
    });

    // --- EXTRACTION LOGIC ---
    const btnRunExt = document.getElementById('btn-run-ext');
    btnRunExt.addEventListener('click', function() {
        const raw = document.getElementById('input-ext').value;
        if(!raw.trim()) return alert("Sila masukkan input!");

        const pattern = "<!DOCTYPE html>\\s*<html[\\s\\S]*?>[\\s\\S]*?<\\/script>\\s*<\\/body>\\s*<\\/html>";
        const htmlRegex = new RegExp(pattern, "gi");

        const htmlMatches = raw.match(htmlRegex);
        let normalText = raw.replace(htmlRegex, "[HTML_REMOVED]");

        let cleanText = normalText.split("[HTML_REMOVED]")
            .map(chunk => chunk.replace(/```[a-zA-Z]*\n?/g, "").replace(/```/g, "").trim())
            .filter(chunk => chunk !== "")
            .join("\n\n---\n\n");

        document.getElementById('out-html').value = htmlMatches ? htmlMatches.join("\n\n") : "Kod HTML tidak ditemui.";
        document.getElementById('out-text').value = cleanText || "Tiada teks penerangan ditemui.";
    });

    // --- ULTRA JSON REPAIR ---
    const btnRunBeau = document.getElementById('btn-run-beau');
    btnRunBeau.addEventListener('click', function() {
        const raw = document.getElementById('input-beau').value.trim();
        const status = document.getElementById('json-status');
        const output = document.getElementById('out-json');

        if(!raw) return alert("Sila masukkan data JSON!");

        let clean = raw.replace(/```[a-zA-Z]*\n?/g, '').replace(/```/g, '').trim();

        try {
            // 1. BASIC CLEANING
            let repaired = clean
                .replace(/\/\*[\s\S]*?\*\/|([^\\:]|^)\/\/.*$/gm, '$1') // Buang comments
                .replace(/['’‘]/g, '"') // Quotes fix
                .replace(/,\s*([\]}])/g, '$1') // Trailing commas dalam objek
                .replace(/([{,]\s*)([a-zA-Z0-9_]+?)\s*:/g, '$1"$2":'); // Quote keys

            // 2. SURGICAL FIX: Buang koma terakhir di hujung string (Punca error kau tadi)
            repaired = repaired.trim();
            if (repaired.endsWith(',')) {
                repaired = repaired.slice(0, -1);
            }

            // 3. AUTO-ARRAY FIX: Kalau ada banyak objek tapi takde [ ]
            if (!repaired.startsWith('[') && repaired.includes('},{')) {
                repaired = '[' + repaired + ']';
            }

            // 4. PARSE & BEAUTIFY
            const obj = JSON.parse(repaired);
            output.value = JSON.stringify(obj, null, 2);
            status.innerText = "Status: ✅ REPAIR BERJAYA";
            status.className = "status-ok";
        } catch (e) {
            // Cuba cara terakhir: Bungkus dalam array secara paksa kalau masih gagal
            try {
                let forced = '[' + clean.replace(/,\s*$/, '').trim() + ']';
                const obj = JSON.parse(forced);
                output.value = JSON.stringify(obj, null, 2);
                status.innerText = "Status: ⚠️ AUTO-WRAPPED ARRAY";
                status.className = "status-ok";
            } catch (e2) {
                output.value = "❌ GAGAL REPAIR\n------------------\n" + e.message;
                status.innerText = "Status: ❌ RALAT KRITIKAL";
                status.className = "status-err";
            }
        }
    });

    // --- UNIVERSAL COPY ---
    function fastCopy(id, btn) {
        const area = document.getElementById(id);
        if(!area.value || area.value.includes("akan muncul")) return;
        area.select();
        document.execCommand('copy');
        const ori = btn.innerText;
        btn.innerText = "COPIED! ✅";
        setTimeout(() => { btn.innerText = ori; }, 1500);
    }

    document.getElementById('btn-copy-html').onclick = function() { fastCopy('out-html', this); };
    document.getElementById('btn-copy-text').onclick = function() { fastCopy('out-text', this); };
    document.getElementById('btn-copy-json').onclick = function() { fastCopy('out-json', this); };

    // --- DOWNLOAD ---
    document.getElementById('btn-download-html').onclick = () => {
        const code = document.getElementById('out-html').value;
        if(!code || code.includes("tidak ditemui")) return alert("Tiada kod!");
        const blob = new Blob([code], { type: 'text/html' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'index.html';
        a.click();
    };

    // --- CLEAR ---
    document.getElementById('btn-clear-ext').onclick = () => {
        document.getElementById('input-ext').value = "";
        document.getElementById('out-html').value = "";
        document.getElementById('out-text').value = "";
    };
    document.getElementById('btn-clear-beau').onclick = () => {
        document.getElementById('input-beau').value = "";
        document.getElementById('out-json').value = "";
        document.getElementById('json-status').innerText = "Status: Menunggu input...";
    };
});
</script>
</body>
</html>
