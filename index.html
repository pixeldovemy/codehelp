<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Multi-Separator v6.1 - JSON Surgeon</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; font-family: 'Fredoka', sans-serif; }
        body { background: #f0f2f5; margin: 0; padding: 20px; }
        .wrapper { max-width: 1400px; margin: 0 auto; background: white; padding: 25px; border-radius: 30px; box-shadow: 0 15px 35px rgba(0,0,0,0.1); }
        .nav-tabs { display: flex; gap: 15px; margin-bottom: 25px; border-bottom: 3px solid #eee; padding-bottom: 15px; }
        .nav-btn { flex: 1; padding: 15px; border: none; border-radius: 15px; cursor: pointer; font-weight: bold; font-size: 16px; transition: 0.3s; background: #dfe6e9; color: #636e72; }
        .nav-btn.active { background: #6c5ce7; color: white; }
        .mode-content { display: none; }
        .mode-content.active { display: block; }
        h2 { color: #6c5ce7; margin-top: 0; font-size: 22px; margin-bottom: 15px; }
        .btn-row { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
        .btn { padding: 12px 25px; border: none; border-radius: 12px; cursor: pointer; font-weight: bold; color: white; transition: 0.2s; font-size: 13px; border-bottom: 4px solid rgba(0,0,0,0.2); }
        .btn-action { background: #6c5ce7; }
        .btn-clear { background: #ff4757; }
        .btn-copy { background: #00b894; }
        .btn:active { transform: translateY(2px); border-bottom-width: 2px; }
        textarea { width: 100%; height: 550px; padding: 15px; border-radius: 15px; border: 2px solid #eee; background: #f9f9f9; font-family: 'Courier New', monospace; font-size: 12px; color: #2d3436; line-height: 1.5; outline: none; resize: none; transition: 0.3s; }
        textarea:focus { border-color: #6c5ce7; background: #fff; }
        #json-status { font-size: 13px; font-weight: bold; margin-bottom: 10px; display: block; padding: 10px; border-radius: 10px; }
        .status-ok { background: #eafff2; color: #27ae60; border: 1px solid #27ae60; }
        .status-err { background: #fff0f0; color: #e74c3c; border: 1px solid #e74c3c; }
    </style>
</head>
<body>

<div class="wrapper">
    <div class="nav-tabs">
        <button id="tab-ext-btn" class="nav-btn active">1. EXTRACTION MODE ✂️</button>
        <button id="tab-beau-btn" class="nav-btn">2. BEAUTIFY MODE ✨</button>
    </div>

    <div id="page-extraction" class="mode-content active">
        <h2>HTML Hunter & Text Extractor</h2>
        <div class="btn-row">
            <button id="btn-run-ext" class="btn btn-action">ASINGKAN SEKARANG 🚀</button>
            <button id="btn-clear-ext" class="btn btn-clear">PADAM SEMUA 🗑️</button>
            <button id="btn-copy-html" class="btn btn-copy">COPY HTML 🌐</button>
            <button id="btn-copy-text" class="btn btn-copy">COPY TEXT 💬</button>
        </div>
        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px;">
            <div class="column"><textarea id="input-ext" placeholder="Paste respon AI kat sini..."></textarea></div>
            <div class="column"><textarea id="out-html" readonly placeholder="Kod HTML akan muncul..." onclick="this.select()"></textarea></div>
            <div class="column"><textarea id="out-text" readonly style="font-family: 'Fredoka';" placeholder="Teks akan muncul..." onclick="this.select()"></textarea></div>
        </div>
    </div>

    <div id="page-beautify" class="mode-content">
        <h2>JSON Ultra-Surgeon 6.0 (Black Hole Fix)</h2>
        <div class="btn-row">
            <button id="btn-run-beau" class="btn btn-action" style="background: #e17055;">SUPER REPAIR & BEAUTIFY ✨</button>
            <button id="btn-clear-beau" class="btn btn-clear">PADAM SEMUA 🗑️</button>
            <button id="btn-copy-json" class="btn btn-copy">COPY JSON 📂</button>
        </div>
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
            <div class="column"><textarea id="input-beau" placeholder="Paste JSON CSV/Double Quote kat sini..."></textarea></div>
            <div class="column">
                <span id="json-status">Sedia membaiki data anda...</span>
                <textarea id="out-json" readonly style="color: #0984e3; font-weight: bold;" placeholder="Hasil repair akan muncul..." onclick="this.select()"></textarea>
            </div>
        </div>
    </div>
</div>

<script>
document.addEventListener("DOMContentLoaded", function() {
    const tabExtBtn = document.getElementById('tab-ext-btn');
    const tabBeauBtn = document.getElementById('tab-beau-btn');
    const pageExt = document.getElementById('page-extraction');
    const pageBeau = document.getElementById('page-beautify');

    // TABS SWITCHING
    tabExtBtn.onclick = () => { tabExtBtn.classList.add('active'); tabBeauBtn.classList.remove('active'); pageExt.classList.add('active'); pageBeau.classList.remove('active'); };
    tabBeauBtn.onclick = () => { tabBeauBtn.classList.add('active'); tabExtBtn.classList.remove('active'); pageBeau.classList.add('active'); pageExt.classList.remove('active'); };

    // --- EXTRACTION LOGIC ---
    document.getElementById('btn-run-ext').onclick = () => {
        const raw = document.getElementById('input-ext').value;
        const htmlRegex = /<!DOCTYPE html>[\s\S]*?<\/html>/gi;
        const htmlMatches = raw.match(htmlRegex);
        document.getElementById('out-html').value = htmlMatches ? htmlMatches.join("\n\n") : "Tiada HTML.";
        document.getElementById('out-text').value = raw.replace(htmlRegex, "").trim();
    };

    // CLEAR EXTRACTION
    document.getElementById('btn-clear-ext').onclick = () => {
        document.getElementById('input-ext').value = "";
        document.getElementById('out-html').value = "";
        document.getElementById('out-text').value = "";
    };

    // COPY EXTRACTION DATA
    function copyVal(id, btnId) {
        const out = document.getElementById(id);
        const btn = document.getElementById(btnId);
        if(!out.value || out.value.includes("Tiada")) return;
        out.select();
        document.execCommand('copy');
        const originalText = btn.innerText;
        btn.innerText = "BERJAYA! ✅";
        setTimeout(() => { btn.innerText = originalText; }, 1500);
    }

    document.getElementById('btn-copy-html').onclick = () => copyVal('out-html', 'btn-copy-html');
    document.getElementById('btn-copy-text').onclick = () => copyVal('out-text', 'btn-copy-text');

    // --- THE ULTIMATE JSON SURGEON 6.0 (MAINTAINED) ---
    document.getElementById('btn-run-beau').onclick = () => {
        let raw = document.getElementById('input-beau').value.trim();
        const status = document.getElementById('json-status');
        const output = document.getElementById('out-json');

        if(!raw) return alert("Sila masukkan data!");

        try {
            let clean = raw.replace(/""/g, '"');
            if (clean.startsWith('"') && clean.endsWith('"')) {
                clean = clean.substring(1, clean.length - 1);
            }

            const startIdx = Math.min(
                clean.indexOf('{') === -1 ? Infinity : clean.indexOf('{'),
                clean.indexOf('[') === -1 ? Infinity : clean.indexOf('[')
            );
            const lastBrace = clean.lastIndexOf('}');
            const lastBracket = clean.lastIndexOf(']');
            const endIdx = Math.max(lastBrace, lastBracket);

            if (startIdx === Infinity || endIdx === -1) {
                throw new Error("Struktur JSON { } atau [ ] tidak ditemui!");
            }

            let body = clean.substring(startIdx, endIdx + 1).trim();

            if (body.includes('},') || body.includes('}\n{') || body.includes('}{')) {
                if (!body.startsWith('[')) {
                    body = body.replace(/}\s*([^{}\[\]]*)\s*{/g, '},{');
                    body = '[' + body + ']';
                }
            }
            body = body.replace(/,\s*([\]}])/g, '$1');
            const parsed = JSON.parse(body);
            output.value = JSON.stringify(parsed, null, 2);
            
            status.innerText = "✅ BERJAYA: Data telah dibaiki & disusun semula!";
            status.className = "status-ok";

        } catch (e) {
            status.innerText = "❌ RALAT: " + e.message;
            status.className = "status-err";
            output.value = "PUNCA GAGAL:\n" + e.stack;
        }
    };

    // COPY JSON
    document.getElementById('btn-copy-json').onclick = function() {
        const out = document.getElementById('out-json');
        if(!out.value) return;
        out.select();
        document.execCommand('copy');
        const originalText = this.innerText;
        this.innerText = "BERJAYA DI-COPY! ✅";
        setTimeout(() => { this.innerText = originalText; }, 2000);
    };

    document.getElementById('btn-clear-beau').onclick = () => {
        document.getElementById('input-beau').value = "";
        document.getElementById('out-json').value = "";
        const status = document.getElementById('json-status');
        status.innerText = "Sedia membaiki data anda...";
        status.className = "";
    };
});
</script>
</body>
</html>
