<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Multi-Separator v5.0 - Specialist Mode</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; font-family: 'Fredoka', sans-serif; }
        body { background: #f0f2f5; margin: 0; padding: 20px; }
        .wrapper { max-width: 1300px; margin: 0 auto; background: white; padding: 25px; border-radius: 30px; box-shadow: 0 15px 35px rgba(0,0,0,0.1); }
        
        /* Navigation Tabs */
        .nav-tabs { display: flex; gap: 15px; margin-bottom: 25px; border-bottom: 3px solid #eee; padding-bottom: 15px; }
        .nav-btn { 
            flex: 1; padding: 15px; border: none; border-radius: 15px; cursor: pointer; 
            font-weight: bold; font-size: 16px; transition: 0.3s; background: #dfe6e9; color: #636e72;
        }
        .nav-btn.active { background: #6c5ce7; color: white; }

        /* General UI Elements */
        h2 { color: #6c5ce7; margin-top: 0; font-size: 20px; }
        textarea { 
            width: 100%; height: 350px; padding: 15px; border-radius: 15px; border: 2px solid #ddd;
            font-size: 13px; outline: none; resize: none; background: #fff;
        }
        .display { 
            width: 100%; height: 350px; padding: 15px; border-radius: 15px; border: 2px solid #eee;
            background: #f9f9f9; font-family: 'Courier New', monospace; font-size: 13px; 
            overflow-y: auto; white-space: pre-wrap; color: #2d3436;
        }

        .btn-row { display: flex; gap: 10px; margin: 15px 0; flex-wrap: wrap; }
        .btn { 
            padding: 12px 20px; border: none; border-radius: 12px; cursor: pointer; 
            font-weight: bold; color: white; transition: 0.2s;
        }
        .btn-action { background: #6c5ce7; }
        .btn-clear { background: #ff4757; }
        .btn-copy { background: #00b894; }
        .btn:hover { opacity: 0.9; transform: scale(0.98); }

        /* Grid Layouts */
        .mode-content { display: none; }
        .mode-content.active { display: block; }

        .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; }
        .grid-2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; }

        @media (max-width: 900px) {
            .grid-3, .grid-2 { grid-template-columns: 1fr; }
        }

        .label { font-size: 12px; font-weight: bold; color: #6c5ce7; margin-bottom: 5px; display: block; text-transform: uppercase; }
    </style>
</head>
<body>

<div class="wrapper">
    <!-- Main Navigation -->
    <div class="nav-tabs">
        <button id="tab-ext" class="nav-btn active" onclick="switchMode('extraction')">1. EXTRACTION MODE ✂️</button>
        <button id="tab-beau" class="nav-btn" onclick="switchMode('beautify')">2. BEAUTIFY MODE ✨</button>
    </div>

    <!-- 1. EXTRACTION PAGE -->
    <div id="page-extraction" class="mode-content active">
        <h2>HTML & Text Extractor</h2>
        <div class="btn-row">
            <button class="btn btn-action" onclick="runExtraction()">ASINGKAN SEKARANG 🚀</button>
            <button class="btn btn-clear" onclick="resetPage()">PADAM SEMUA 🗑️</button>
            <button class="btn btn-copy" onclick="copyValue('out-html', this)">COPY HTML 🌐</button>
            <button class="btn btn-copy" onclick="copyValue('out-text', this)">COPY TEXT 💬</button>
        </div>
        
        <div class="grid-3">
            <div>
                <span class="label">Original Input</span>
                <textarea id="input-ext" placeholder="Paste respon AI kat sini..."></textarea>
            </div>
            <div>
                <span class="label">HTML Page Code</span>
                <div id="out-html" class="display">Kod HTML akan muncul di sini...</div>
            </div>
            <div>
                <span class="label">Normal Text</span>
                <div id="out-text" class="display" style="font-family: 'Fredoka', sans-serif;">Teks biasa akan muncul di sini...</div>
            </div>
        </div>
    </div>

    <!-- 2. BEAUTIFY PAGE -->
    <div id="page-beautify" class="mode-content">
        <h2>JSON Beautifier</h2>
        <div class="btn-row">
            <button class="btn btn-action" onclick="runBeautify()" style="background: #e17055;">BEAUTIFY CODE ✨</button>
            <button class="btn btn-clear" onclick="resetPage()">PADAM SEMUA 🗑️</button>
            <button class="btn btn-copy" onclick="copyValue('out-json', this)">COPY JSON CODE 📂</button>
        </div>

        <div class="grid-2">
            <div>
                <span class="label">Original JSON Input</span>
                <textarea id="input-beau" placeholder="Paste data JSON yang berterabur kat sini..."></textarea>
            </div>
            <div>
                <span class="label">Beautified Code</span>
                <div id="out-json" class="display" style="color: #0984e3; font-weight: bold;">JSON yang kemas akan muncul di sini...</div>
            </div>
        </div>
    </div>
</div>

<script>
    // Tab Switching Logic
    function switchMode(mode) {
        document.querySelectorAll('.nav-btn, .mode-content').forEach(el => el.classList.remove('active'));
        if(mode === 'extraction') {
            document.getElementById('tab-ext').classList.add('active');
            document.getElementById('page-extraction').classList.add('active');
        } else {
            document.getElementById('tab-beau').classList.add('active');
            document.getElementById('page-beautify').classList.add('active');
        }
    }

    // EXTRACTION LOGIC
    function runExtraction() {
        const raw = document.getElementById('input-ext').value.trim();

    // BEAUTIFY LOGIC
    function runBeautify() {
        const raw = document.getElementById('input-beau').value.trim();
        if(!raw) return alert("Sila masukkan data JSON!");

        try {
            const obj = JSON.parse(clean);

            document.getElementById('out-json').innerText = "❌ Ralat Format JSON:\n" + e.message;

    // Universal Copy
    function copyValue(id, btn) {
        const text = document.getElementById(id).innerText;
        if(!text || text.includes("muncul di sini")) return;

        const el = document.createElement('textarea');
        el.value = text;
        document.body.appendChild(el);
        el.select();
        document.execCommand('copy');
        document.body.removeChild(el);

        const ori = btn.innerText;
        btn.innerText = "COPIED! ✅";
        setTimeout(() => btn.innerText = ori, 1500);
    }

    // Reset Page
    function resetPage() {
        if(confirm("Padam semua data dalam mode ini?")) {
            const activePage = document.querySelector('.mode-content.active');
            activePage.querySelectorAll('textarea').forEach(t => t.value = "");
            activePage.querySelectorAll('.display').forEach(d => {
                if(d.id === 'out-html') d.innerText = "Kod HTML akan muncul di sini...";
                if(d.id === 'out-text') d.innerText = "Teks biasa akan muncul di sini...";
                if(d.id === 'out-json') d.innerText = "JSON yang kemas akan muncul di sini...";
            });
        }
    }
</script>
</body>
</html>
