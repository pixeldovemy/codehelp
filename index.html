
<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Separator v3.0 - Ultimate Splitter</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; font-family: 'Fredoka', sans-serif; }
        body { background: #f0f2f5; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 1100px; margin: 0 auto; background: white; padding: 30px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        h1 { color: #6c5ce7; text-align: center; margin-top: 0; }
        
        textarea#raw-input { 
            width: 100%; height: 150px; padding: 15px; border-radius: 15px; border: 2px solid #ddd;
            font-size: 14px; margin-bottom: 15px; outline: none; resize: vertical;
        }
        
        .main-btns { display: flex; gap: 10px; margin-bottom: 25px; flex-wrap: wrap; }
        .btn { 
            flex: 1; padding: 12px; border: none; border-radius: 10px; cursor: pointer; 
            font-weight: bold; color: white; transition: 0.2s; min-width: 150px;
        }
        .btn-blue { background: #6c5ce7; }
        .btn-green { background: #00b894; }
        .btn-red { background: #ff4757; }
        .btn:hover { opacity: 0.9; transform: translateY(-2px); }

        .output-section { display: grid; grid-template-columns: 1fr; gap: 20px; }
        @media(min-width: 768px) { .output-section { grid-template-columns: 1fr 1fr; } }
        .full { grid-column: 1 / -1; }

        .box { background: #f9f9f9; border: 1px solid #eee; border-radius: 15px; padding: 15px; }
        .box-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .box-header span { font-weight: bold; color: #6c5ce7; font-size: 14px; }
        
        .copy-btn { background: #f1f2f6; border: 1px solid #ccc; padding: 5px 10px; border-radius: 5px; cursor: pointer; font-size: 11px; }
        .copy-btn:hover { background: #6c5ce7; color: white; }

        .res-area { 
            background: white; border: 1px solid #eee; padding: 10px; border-radius: 10px; 
            height: 250px; overflow-y: auto; font-family: monospace; font-size: 13px; white-space: pre-wrap;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>AI Splitter v3.0 ✂️</h1>
    
    <textarea id="raw-input" placeholder="Paste respon AI kat sini..."></textarea>
    
    <div class="main-btns">
        <button id="btn-split" class="btn btn-blue">ASINGKAN SEMUA 🚀</button>
        <button id="btn-copy-all" class="btn btn-green">SALIN SEMUA ASAL 📋</button>
        <button id="btn-clear" class="btn btn-red">RESET 🗑️</button>
    </div>

    <div class="output-section">
        <!-- Kotak Teks -->
        <div class="box">
            <div class="box-header">
                <span>💬 TEXT EXTRACTION</span>
                <button id="copy-text" class="copy-btn">COPY TEXT</button>
            </div>
            <div id="out-text" class="res-area">Penerangan AI...</div>
        </div>

        <!-- Kotak JSON -->
        <div class="box">
            <div class="box-header">
                <span>📂 JSON BEAUTIFIED</span>
                <button id="copy-json" class="copy-btn">COPY JSON</button>
            </div>
            <div id="out-json" class="res-area">Data JSON...</div>
        </div>

        <!-- Kotak HTML -->
        <div class="box full">
            <div class="box-header">
                <span>🌐 HTML PAGE CODE</span>
                <button id="copy-html" class="copy-btn">COPY HTML</button>
            </div>
            <div id="out-html" class="res-area">Kod HTML akan muncul di sini...</div>
        </div>
    </div>
</div>

<script>
    // FUNGSI COPY (Confirm Jalan)
    function copyDulu(elementId, btn) {
        const text = document.getElementById(elementId).innerText;
        if (!text || text.includes("Penerangan AI") || text.includes("Kod HTML")) return;

        const dummy = document.createElement("textarea");
        document.body.appendChild(dummy);
        dummy.value = text;
        dummy.select();
        document.execCommand("copy");
        document.body.removeChild(dummy);

        const ori = btn.innerText;
        btn.innerText = "COPIED! ✅";
        setTimeout(() => btn.innerText = ori, 1500);
    }

        document.getElementById('btn-clear').onclick = function() {

</script>
</body>
</html>
