<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Multi-Separator v4.0</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; font-family: 'Fredoka', sans-serif; }
        body { background: #eef2f7; margin: 0; padding: 20px; }
        .wrapper { max-width: 1000px; margin: 0 auto; background: white; padding: 25px; border-radius: 30px; box-shadow: 0 15px 35px rgba(0,0,0,0.1); }
        h1 { color: #6c5ce7; text-align: center; margin-bottom: 20px; }
        
        textarea#raw-input { 
            width: 100%; height: 160px; padding: 15px; border-radius: 20px; border: 2px solid #ddd;
            font-size: 14px; margin-bottom: 20px; outline: none; resize: vertical;
        }

        .btn-group { display: flex; gap: 10px; margin-bottom: 25px; }
        .btn-main { 
            flex: 1; padding: 15px; border: none; border-radius: 15px; cursor: pointer; 
            font-weight: bold; color: white; font-size: 14px; transition: 0.3s;
        }
        .btn-process { background: #6c5ce7; }
        .btn-clear { background: #ff4757; }
        .btn-main:hover { opacity: 0.9; transform: scale(0.98); }

        .output-container { display: flex; flex-direction: column; gap: 20px; }
        .out-box { background: #f8f9fa; border: 1px solid #eee; border-radius: 20px; padding: 20px; }
        .out-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .out-header span { font-weight: bold; color: #6c5ce7; font-size: 15px; }
        
        .copy-btn { 
            background: #6c5ce7; color: white; border: none; padding: 7px 15px; 
            border-radius: 10px; cursor: pointer; font-size: 12px; font-weight: bold;
        }

        .display { 
            background: #fff; border: 1px solid #ddd; padding: 15px; border-radius: 15px; 
            height: 250px; overflow-y: auto; font-family: 'Courier New', Courier, monospace; 
            font-size: 13px; white-space: pre-wrap; color: #333; line-height: 1.5;
        }
    </style>
</head>
<body>

<div class="wrapper">
    <h1>AI Splitter v4.0 ✂️</h1>
    
    <textarea id="raw-input" placeholder="Paste respon AI kat sini... (Pastikan ada simbol ``` kalau kod)"></textarea>
    
    <div class="btn-group">
        <button id="process-all" class="btn-main btn-process">ASINGKAN SEKARANG 🚀</button>
        <button id="reset-all" class="btn-main btn-clear">PADAM SEMUA 🗑️</button>
    </div>

    <div class="output-container">
        <!-- 1. HTML Extraction -->
        <div class="out-box">
            <div class="out-header">
                <span>🌐 HTML PAGE CODE</span>
                <button class="copy-btn" onclick="copyResult('html-res', this)">COPY HTML</button>
            </div>
            <div id="html-res" class="display">Hasil kod HTML akan muncul di sini...</div>
        </div>

        <!-- 2. Text Extraction -->
        <div class="out-box">
            <div class="out-header">
                <span>💬 TEXT EXTRACTION</span>
                <button class="copy-btn" onclick="copyResult('text-res', this)">COPY TEXT</button>
            </div>
            <div id="text-res" class="display" style="font-family: 'Fredoka', sans-serif;">Penerangan AI akan muncul di sini...</div>
        </div>

        <!-- 3. JSON Beautifier -->
        <div class="out-box">
            <div class="out-header">
                <span>📂 JSON BEAUTIFIED</span>
                <button class="copy-btn" onclick="copyResult('json-res', this)">COPY JSON</button>
            </div>
            <div id="json-res" class="display" style="color: #0984e3;">Data JSON yang kemas akan muncul di sini...</div>
        </div>
    </div>
</div>

<script>
    // FUNGSI COPY UNIVERSAL
    function copyResult(id, btn) {
        const target = document.getElementById(id);
        const text = target.innerText;
        
        if (!text || text.includes("akan muncul di sini")) return;

        const el = document.createElement('textarea');
        el.value = text;
        document.body.appendChild(el);
        el.select();
        document.execCommand('copy');
        document.body.removeChild(el);

        const oriText = btn.innerText;
        btn.innerText = "COPIED! ✅";
        btn.style.background = "#2ecc71";
        setTimeout(() => {
            btn.innerText = oriText;
            btn.style.background = "#6c5ce7";
        }, 1500);
    }

    // LOGIK UTAMA
    document.getElementById('process-all').onclick = function() {
        const raw = document.getElementById('raw-input').value.trim();
        if (!raw) return alert("Sila paste dulu bro!");

        const htmlBox = document.getElementById('html-res');
        const textBox = document.getElementById('text-res');
        const jsonBox = document.getElementById('json-res');

        // Pecahkan ikut simbol ```
        const parts = raw.split(/```/);
        
        let htmlList = [];
        let textList = [];
        let jsonList = [];

        parts.forEach((part, index) => {
            // Index genap (0, 2, 4...) selalunya teks luar backticks
            if (index % 2 === 0) {
                if (part.trim()) textList.push(part.trim());
            } 
            // Index ganjil (1, 3, 5...) selalunya dalam backticks (KOD)
            else {
                let cleanCode = part.replace(/^[a-zA-Z]+\n/, '').trim(); // Buang label bahasa (html/json)
                
                // Cek kalau kod ni JSON
                if (cleanCode.startsWith('{') || cleanCode.startsWith('[')) {
                    try {
                        const parsed = JSON.parse(cleanCode);
                        jsonList.push(JSON.stringify(parsed, null, 2));
                    } catch (e) {
                        jsonList.push(cleanCode); // Kalau parse gagal, letak raw JSON
                    }
                } 
                // Cek kalau kod ni HTML
                else if (cleanCode.toLowerCase().includes('<html') || cleanCode.toLowerCase().includes('<!doctype') || cleanCode.includes('</div>')) {
                    htmlList.push(cleanCode);
                }
                // Selain tu masuk HTML box juga (sebagai General Code)
                else {
                    htmlList.push(cleanCode);
                }
            }
        });

        // Paparkan hasil
        htmlBox.innerText = htmlList.length > 0 ? htmlList.join("\n\n/* --- NEXT BLOCK --- */\n\n") : "Tiada kod HTML ditemui.";
        textBox.innerText = textList.length > 0 ? textList.join("\n\n") : "Tiada teks ditemui.";
        jsonBox.innerText = jsonList.length > 0 ? jsonList.join("\n\n") : "Tiada JSON ditemui.";
    };

    // TOMBOL RESET
    document.getElementById('reset-all').onclick = function() {
        if (confirm("Reset semua data?")) {
            location.reload();
        }
    };
</script>
</body>
</html>
