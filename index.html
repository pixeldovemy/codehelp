<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Code Separator v1.8 - Final Fix</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; font-family: 'Fredoka', sans-serif; }
        body { 
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            margin: 0; padding: 20px; display: flex; justify-content: center; min-height: 100vh;
        }
        .main-wrapper { max-width: 1000px; width: 100%; }
        .container { 
            background: rgba(255, 255, 255, 0.98); padding: 30px; border-radius: 40px; 
            box-shadow: 0 25px 50px rgba(0,0,0,0.2); border: 8px solid #fff;
        }
        h1 { color: #6c5ce7; text-align: center; margin-bottom: 5px; text-transform: uppercase; letter-spacing: -1px; }
        .version-tag { text-align: center; font-size: 12px; color: #a29bfe; margin-bottom: 20px; font-weight: bold; }
        
        textarea { 
            width: 100%; height: 180px; padding: 20px; border-radius: 25px; border: 3px solid #eee;
            font-size: 15px; outline: none; margin-bottom: 15px; resize: vertical; transition: 0.3s;
            background: #fdfdfd;
        }
        textarea:focus { border-color: #6c5ce7; background: #fff; box-shadow: 0 10px 20px rgba(108, 92, 231, 0.1); }

        .action-bars { display: flex; gap: 10px; margin-bottom: 30px; flex-wrap: wrap; }
        .btn { 
            flex: 1; padding: 15px; border: none; border-radius: 15px; cursor: pointer; 
            font-size: 14px; font-weight: bold; transition: 0.2s; color: white;
            min-width: 140px; text-transform: uppercase;
        }
        .btn-process { background: #6c5ce7; box-shadow: 0 6px 0 #4834d4; }
        .btn-json { background: #f1c40f; color: #2d3436; box-shadow: 0 6px 0 #d4ac0d; }
        .btn-copy-raw { background: #00b894; box-shadow: 0 6px 0 #00876c; }
        .btn-clear { background: #ff4757; box-shadow: 0 6px 0 #b33939; }
        
        .btn:active { transform: translateY(4px); box-shadow: 0 2px 0 rgba(0,0,0,0.2); }

        .output-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
        @media (max-width: 768px) { .output-grid { grid-template-columns: 1fr; } }

        .box { background: #f1f2f6; border-radius: 25px; padding: 20px; border: 1px solid #ddd; }
        .full-width { grid-column: 1 / -1; background: #ebf3ff; border: 2px dashed #6c5ce7; }
        
        .box-title { 
            font-size: 14px; font-weight: bold; color: #6c5ce7; margin-bottom: 12px; 
            display: flex; justify-content: space-between; align-items: center; 
        }
        .copy-small { 
            background: #6c5ce7; color: white; border: none; padding: 6px 12px; 
            border-radius: 10px; font-size: 12px; cursor: pointer; transition: 0.3s;
        }

        .display-area { 
            background: #fff; border-radius: 15px; padding: 15px; border: 1px solid #eee; 
            height: 300px; overflow-y: auto; font-size: 13px; white-space: pre-wrap; word-break: break-word;
            font-family: 'Courier New', Courier, monospace; color: #333; line-height: 1.5;
        }
        .json-mode { color: #2e86de; font-weight: bold; height: 400px; }
        .text-mode { font-family: 'Fredoka', sans-serif !important; font-size: 14px; color: #2d3436; }
        .error-json { color: #e74c3c; border: 2px solid #ff7675; background: #fff5f5; }
        .success-fix { border: 2px solid #27ae60; background: #f0fff4; }
    </style>
</head>
<body>

<div class="main-wrapper">
    <div class="container">
        <h1>Code Separator ✂️</h1>
        <div class="version-tag">VERSION 1.8 - STABLE FIX</div>
        
        <textarea id="raw-input" placeholder="Paste respon dari AI kat sini..."></textarea>
        
        <div class="action-bars">
            <button class="btn btn-process" onclick="separateNow()">ASINGKAN KOD 🚀</button>
            <button class="btn btn-json" onclick="beautifyAndRepairJSON()">KEMAS JSON ✨</button>
            <button class="btn btn-copy-raw" onclick="copyToClipboard(event, 'raw-input')">SALIN ASAL 📋</button>
            <button class="btn btn-clear" onclick="clearAll()">PADAM SEMUA 🗑️</button>
        </div>

        <div class="output-grid">
            <div class="box">
                <div class="box-title">
                    <span>CLEAN CODE 💎</span>
                    <button class="copy-small" onclick="copyToClipboard(event, 'code-output')">Copy Code</button>
                </div>
                <div id="code-output" class="display-area">Kod akan muncul di sini...</div>
            </div>

            <div class="box">
                <div class="box-title">
                    <span>NORMAL TEXT 💬</span>
                    <button class="copy-small" onclick="copyToClipboard(event, 'text-output')">Copy Text</button>
                </div>
                <div id="text-output" class="display-area text-mode">Teks akan muncul di sini...</div>
            </div>

            <div class="box full-width">
                <div class="box-title">
                    <span id="json-status">JSON MEGA REPAIR 📂</span>
                    <button class="copy-small" style="background: #27ae60;" onclick="copyToClipboard(event, 'json-output')">Copy JSON</button>
                </div>
                <div id="json-output" class="display-area json-mode">Keputusan JSON repair akan dipaparkan di sini...</div>
            </div>
        </div>
    </div>
</div>

<script>
    function separateNow() {
        const input = document.getElementById('raw-input').value;
        const codeOutput = document.getElementById('code-output');
        const textOutput = document.getElementById('text-output');

        if (!input.trim()) return alert("Paste dulu baru syok!");

        const codeRegex = /

/* --- NEXT BLOCK --- */

/g;
        let codes = [];
        let lastIndex = 0;
        let cleanText = "";
        let match;

        while ((match = codeRegex.exec(input)) !== null) {
            cleanText += input.substring(lastIndex, match.index);
            let content = match[0].replace(/^

/* --- NEXT BLOCK --- */

$/, '');
            codes.push(content.trim());
            lastIndex = codeRegex.lastIndex;
        }
        cleanText += input.substring(lastIndex);

        codeOutput.innerText = codes.length > 0 ? codes.join("\n\n/* --- NEXT BLOCK --- */\n\n") : "Tiada kod dijumpai.";
        textOutput.innerText = cleanText.trim() || "Tiada teks dijumpai.";
    }

    function beautifyAndRepairJSON() {
        let input = document.getElementById('raw-input').value.trim();
        const jsonOutput = document.getElementById('json-output');
        const jsonStatus = document.getElementById('json-status');
        if (!input) return alert("Masukkan data dulu!");

        let cleanInput = input.replace(/

/* --- NEXT BLOCK --- */

/g, '').trim();

        try {
            let repaired = cleanInput
                .replace(/\/\*[\s\S]*?\*\/|([^\\:]|^)\/\/.*$/gm, '$1')
                .replace(/['’‘]/g, '"')
                .replace(/,\s*([\]}])/g, '$1')
                .replace(/([{,]\s*)([a-zA-Z0-9_]+?)\s*:/g, '$1"$2":')
                .replace(/\}\s*\{/g, '},{');

            if (repaired.includes('},{') && !repaired.startsWith('[')) repaired = '[' + repaired + ']';

            const jsonObj = JSON.parse(repaired);
            jsonOutput.innerText = JSON.stringify(jsonObj, null, 2);
            jsonOutput.className = 'display-area json-mode success-fix';
            jsonStatus.innerText = "JSON MEGA REPAIR 📂 - ✅ BERJAYA";
        } catch (e) {
            jsonOutput.innerText = "❌ ERROR: " + e.message;
            jsonOutput.className = 'display-area json-mode error-json';
            jsonStatus.innerText = "JSON MEGA REPAIR 📂 - ❌ GAGAL";
        }
    }

    function copyToClipboard(e, elementId) {
        const el = document.getElementById(elementId);
        let textToCopy = (el.tagName === "TEXTAREA") ? el.value : el.innerText;

        // Cek kalau teks tu cuma placeholder
        if (!textToCopy || textToCopy.includes("muncul di sini") || textToCopy.includes("Tiada kod")) {
            return;
        }

        const btn = e.target;
        const originalBg = btn.style.background;

        // Cara Moden
        if (navigator.clipboard && window.isSecureContext) {
            navigator.clipboard.writeText(textToCopy).then(() => {
                showSuccess(btn, originalBg);
            }).catch(err => {
                fallbackCopy(textToCopy, btn, originalBg);
            });
        } else {
            // Cara Fallback (Lama tapi power)
            fallbackCopy(textToCopy, btn, originalBg);
        }
    }

    function fallbackCopy(text, btn, originalBg) {
        const textArea = document.createElement("textarea");
        textArea.value = text;
        document.body.appendChild(textArea);
        textArea.select();
        try {
            document.execCommand('copy');
            showSuccess(btn, originalBg);
        } catch (err) {
            alert('Gagal salin: ', err);
        }
        document.body.removeChild(textArea);
    }

    function showSuccess(btn, originalBg) {
        const originalText = btn.innerText;
        btn.innerText = "COPIED! ✅";
        btn.style.background = "#2ecc71";
        setTimeout(() => { 
            btn.innerText = originalText;
            btn.style.background = originalBg;
        }, 1500);
    }

    function clearAll() {
        if (confirm("Padam semua?")) {
            location.reload();
        }
    }
</script>
</body>
</html>
