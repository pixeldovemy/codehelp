<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Multi-Separator v5.3.6 - The Glue</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; font-family: 'Fredoka', sans-serif; }
        body { background: #f0f2f5; margin: 0; padding: 20px; }
        .wrapper { max-width: 1400px; margin: 0 auto; background: white; padding: 25px; border-radius: 30px; box-shadow: 0 15px 35px rgba(0,0,0,0.1); }

        .nav-tabs { display: flex; gap: 15px; margin-bottom: 25px; border-bottom: 3px solid #eee; padding-bottom: 15px; }
        .nav-btn {
            flex: 1; padding: 15px; border: none; border-radius: 15px; cursor: pointer;
            font-weight: bold; font-size: 16px; transition: 0.3s; background: #dfe6e9; color: #636e72;
        }
        .nav-btn.active { background: #6c5ce7; color: white; }

        .mode-content { display: none; }
        .mode-content.active { display: block; }

        h2 { color: #6c5ce7; margin-top: 0; font-size: 22px; margin-bottom: 15px; }

        .btn-row { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
        .btn {
            padding: 12px 25px; border: none; border-radius: 12px; cursor: pointer;
            font-weight: bold; color: white; transition: 0.2s; font-size: 14px;
        }
        .btn-action { background: #6c5ce7; border-bottom: 4px solid #4834d4; }
        .btn-clear { background: #ff4757; border-bottom: 4px solid #b33939; }
        .btn-copy { background: #00b894; border-bottom: 4px solid #00876c; }
        .btn:active { transform: translateY(2px); border-bottom-width: 2px; }

        .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 20px; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }

        @media (max-width: 1000px) { .grid-3, .grid-2 { grid-template-columns: 1fr; } }

        .column { display: flex; flex-direction: column; }
        .label { font-size: 13px; font-weight: bold; color: #6c5ce7; margin-bottom: 8px; text-transform: uppercase; }

        textarea {
            width: 100%; height: 550px; padding: 15px; border-radius: 15px; border: 2px solid #ddd;
            font-size: 12px; outline: none; resize: none; background: #fff; line-height: 1.5; font-family: monospace;
        }
        .display-box {
            width: 100%; height: 550px; padding: 15px; border-radius: 15px; border: 2px solid #eee;
            background: #f9f9f9; font-family: 'Courier New', monospace; font-size: 12px;
            overflow-y: auto; white-space: pre-wrap; color: #2d3436; line-height: 1.5;
        }
    </style>
</head>
<body>

<div class="wrapper">
    <div class="nav-tabs">
        <button id="tab-ext-btn" class="nav-btn active">1. EXTRACTION MODE ✂️</button>
        <button id="tab-beau-btn" class="nav-btn">2. BEAUTIFY MODE ✨</button>
    </div>

    <!-- EXTRACTION -->
    <div id="page-extraction" class="mode-content active">
        <h2>HTML Deep Hunter & Text Extractor (v5.3.6)</h2>
        <div class="btn-row">
            <button id="btn-run-ext" class="btn btn-action">ASINGKAN SEKARANG 🚀</button>
            <button id="btn-clear-ext" class="btn btn-clear">PADAM SEMUA 🗑️</button>
            <button id="btn-copy-html" class="btn btn-copy">COPY HTML PAGE 🌐</button>
            <button id="btn-copy-text" class="btn btn-copy">COPY TEXT 💬</button>
        </div>

        <div class="grid-3">
            <div class="column">
                <span class="label">Original Input</span>
                <textarea id="input-ext" placeholder="Paste respon AI kat sini..."></textarea>
            </div>
            <div class="column">
                <span class="label">Pure HTML Code</span>
                <div id="out-html" class="display-box">Kod HTML akan muncul di sini...</div>
            </div>
            <div class="column">
                <span class="label">Normal Text Extraction</span>
                <div id="out-text" class="display-box" style="font-family: 'Fredoka', sans-serif;">Penerangan AI akan muncul di sini...</div>
            </div>
        </div>
    </div>

    <!-- BEAUTIFY -->
    <div id="page-beautify" class="mode-content">
        <h2>JSON Beautifier Specialist</h2>
        <div class="btn-row">
            <button id="btn-run-beau" class="btn btn-action" style="background: #e17055;">BEAUTIFY CODE ✨</button>
            <button id="btn-clear-beau" class="btn btn-clear">PADAM SEMUA 🗑️</button>
            <button id="btn-copy-json" class="btn btn-copy">COPY JSON CODE 📂</button>
        </div>

        <div class="grid-2">
            <div class="column">
                <span class="label">Original JSON Input</span>
                <textarea id="input-beau" placeholder="Paste data JSON di sini..."></textarea>
            </div>
            <div class="column">
                <span class="label">Beautified Code</span>
                <div id="out-json" class="display-box" style="color: #0984e3; font-weight: bold;">JSON yang kemas akan muncul di sini...</div>
            </div>
        </div>
    </div>
</div>

<script>
document.addEventListener("DOMContentLoaded", function() {
    const tabExtBtn = document.getElementById('tab-ext-btn');
    const tabBeauBtn = document.getElementById('tab-beau-btn');
    const pageExt = document.getElementById('page-extraction');
    const pageBeau = document.getElementById('page-beautify');

    tabExtBtn.addEventListener('click', () => {
        tabExtBtn.classList.add('active'); tabBeauBtn.classList.remove('active');
        pageExt.classList.add('active'); pageBeau.classList.remove('active');
    });

    tabBeauBtn.addEventListener('click', () => {
        tabBeauBtn.classList.add('active'); tabExtBtn.classList.remove('active');
        pageBeau.classList.add('active'); pageExt.classList.remove('active');
    });

    // --- LOGIK EXTRACTION ---
    const btnRunExt = document.getElementById('btn-run-ext');
    btnRunExt.addEventListener('click', function() {
        const raw = document.getElementById('input-ext').value;
        if(!raw.trim()) return alert("Sila masukkan input!");

        const pattern = "<!DOCTYPE html>\\s*<html[\\s\\S]*?>[\\s\\S]*?<\\/script>\\s*<\\/body>\\s*<\\/html>";
        const htmlRegex = new RegExp(pattern, "gi");

        const htmlMatches = raw.match(htmlRegex);
        let normalText = raw.replace(htmlRegex, "[HTML_REMOVED]");

        let cleanText = normalText.split("[HTML_REMOVED]")
            .map(chunk => {
                return chunk
                    .replace(/```[a-zA-Z]*\n?/g, "") 
                    .replace(/```/g, "")           
                    .trim();
            })
            .filter(chunk => chunk !== "")
            .join("\n\n---\n\n");

        document.getElementById('out-html').innerText = htmlMatches ? htmlMatches.join("\n\n/* --- NEXT PAGE --- */\n\n") : "Kod HTML lengkap tidak ditemui.";
        document.getElementById('out-text').innerText = cleanText || "Tiada teks penerangan ditemui.";
    });

    // --- LOGIK BEAUTIFY ---
    const btnRunBeau = document.getElementById('btn-run-beau');
    btnRunBeau.addEventListener('click', function() {
        const raw = document.getElementById('input-beau').value.trim();
        if(!raw) return alert("Sila masukkan data JSON!");
        let clean = raw.replace(/```[a-zA-Z]*\n?/g, '').replace(/```/g, '').trim();
        try {
            const obj = JSON.parse(clean);
            document.getElementById('out-json').innerText = JSON.stringify(obj, null, 2);
        } catch (e) {
            document.getElementById('out-json').innerText = "❌ RALAT JSON: " + e.message;
        }
    });

    // --- ULTRA STABLE ASYNC COPY ---
    async function copyToClipboard(elementId, btn) {
        const el = document.getElementById(elementId);
        const text = el.innerText;
        
        if(!text || text.includes("muncul di sini") || text.includes("tidak ditemui")) return;

        const originalText = btn.innerText;

        try {
            // Cara 1: Modern Async Clipboard API (Support data besar)
            if (navigator.clipboard && window.isSecureContext) {
                await navigator.clipboard.writeText(text);
                showSuccess(btn, originalText);
            } else {
                throw new Error("Clipboard API fail");
            }
        } catch (err) {
            // Cara 2: Fallback Manual dengan Focus Priority
            const dummy = document.createElement('textarea');
            dummy.style.position = 'fixed';
            dummy.style.left = '-9999px';
            dummy.style.top = '0';
            dummy.value = text;
            document.body.appendChild(dummy);
            dummy.focus();
            dummy.select();
            
            try {
                const successful = document.execCommand('copy');
                if (successful) showSuccess(btn, originalText);
            } catch (fallbackErr) {
                console.error("Copy failed:", fallbackErr);
            }
            document.body.removeChild(dummy);
        }
    }

    function showSuccess(btn, originalText) {
        btn.innerText = "COPIED! ✅";
        btn.style.background = "#2ecc71";
        setTimeout(() => { 
            btn.innerText = originalText; 
            btn.style.background = "";
        }, 1500);
    }

    // BIND BUTTONS
    document.getElementById('btn-copy-html').addEventListener('click', function() { copyToClipboard('out-html', this); });
    document.getElementById('btn-copy-text').addEventListener('click', function() { copyToClipboard('out-text', this); });
    document.getElementById('btn-copy-json').addEventListener('click', function() { copyToClipboard('out-json', this); });

    document.getElementById('btn-clear-ext').addEventListener('click', () => {
        if(confirm("Padam semua?")) {
            document.getElementById('input-ext').value = "";
            document.getElementById('out-html').innerText = "Kod HTML akan muncul di sini...";
            document.getElementById('out-text').innerText = "Penerangan AI akan muncul di sini...";
        }
    });

    document.getElementById('btn-clear-beau').addEventListener('click', () => {
        if(confirm("Padam data Beautify?")) {
            document.getElementById('input-beau').value = "";
            document.getElementById('out-json').innerText = "JSON yang kemas akan muncul di sini...";
        }
    });
});
</script>
</body>
</html>
