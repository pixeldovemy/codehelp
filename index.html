<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Code Separator v2.1 - Ultimate Fix</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; font-family: 'Fredoka', sans-serif; }
        body { 
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            margin: 0; padding: 20px; display: flex; justify-content: center; min-height: 100vh;
        }
        .main-wrapper { max-width: 1000px; width: 100%; }
        .container { 
            background: rgba(255, 255, 255, 0.98); padding: 30px; border-radius: 40px; 
            box-shadow: 0 25px 50px rgba(0,0,0,0.2); border: 8px solid #fff;
        }
        h1 { color: #6c5ce7; text-align: center; margin-bottom: 5px; text-transform: uppercase; letter-spacing: -1px; }
        .status-bar { text-align: center; font-size: 12px; color: #27ae60; margin-bottom: 20px; font-weight: bold; }
        
        textarea { 
            width: 100%; height: 180px; padding: 20px; border-radius: 25px; border: 3px solid #eee;
            font-size: 15px; outline: none; margin-bottom: 15px; resize: vertical; transition: 0.3s;
            background: #fdfdfd;
        }
        textarea:focus { border-color: #6c5ce7; background: #fff; }

        .action-bars { display: flex; gap: 10px; margin-bottom: 30px; flex-wrap: wrap; }
        .btn { 
            flex: 1; padding: 15px; border: none; border-radius: 15px; cursor: pointer; 
            font-size: 14px; font-weight: bold; transition: 0.2s; color: white;
            min-width: 140px; text-transform: uppercase;
        }
        .btn-process { background: #6c5ce7; box-shadow: 0 6px 0 #4834d4; }
        .btn-json { background: #f1c40f; color: #2d3436; box-shadow: 0 6px 0 #d4ac0d; }
        .btn-copy-raw { background: #00b894; box-shadow: 0 6px 0 #00876c; }
        .btn-clear { background: #ff4757; box-shadow: 0 6px 0 #b33939; }
        
        .btn:active { transform: translateY(4px); box-shadow: 0 2px 0 rgba(0,0,0,0.2); }

        .output-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
        @media (max-width: 768px) { .output-grid { grid-template-columns: 1fr; } }

        .box { background: #f1f2f6; border-radius: 25px; padding: 20px; border: 1px solid #ddd; }
        .full-width { grid-column: 1 / -1; background: #ebf3ff; border: 2px dashed #6c5ce7; }
        
        .box-title { 
            font-size: 14px; font-weight: bold; color: #6c5ce7; margin-bottom: 12px; 
            display: flex; justify-content: space-between; align-items: center; 
        }
        .copy-small { 
            background: #6c5ce7; color: white; border: none; padding: 6px 12px; 
            border-radius: 10px; font-size: 12px; cursor: pointer;
        }

        .display-area { 
            background: #fff; border-radius: 15px; padding: 15px; border: 1px solid #eee; 
            height: 300px; overflow-y: auto; font-size: 13px; white-space: pre-wrap;
            font-family: 'Courier New', Courier, monospace; color: #333;
        }
        .json-mode { color: #2e86de; font-weight: bold; height: 400px; }
        .text-mode { font-family: 'Fredoka', sans-serif !important; }
        .success-fix { border: 2px solid #27ae60 !important; }
        .error-json { border: 2px solid #e74c3c !important; }
    </style>
</head>
<body>

<div class="main-wrapper">
    <div class="container">
        <h1>Code Separator ✂️</h1>
        <div id="app-status" class="status-bar">System Ready: v2.1</div>
        
        <textarea id="raw-input" placeholder="Paste respon AI kat sini..."></textarea>
        
        <div class="action-bars">
            <button id="btn-process" class="btn btn-process">ASINGKAN KOD 🚀</button>
            <button id="btn-json" class="btn btn-json">KEMAS JSON ✨</button>
            <button id="btn-copy-raw" class="btn btn-copy-raw">SALIN ASAL 📋</button>
            <button id="btn-clear" class="btn btn-clear">PADAM SEMUA 🗑️</button>
        </div>

        <div class="output-grid">
            <div class="box">
                <div class="box-title">
                    <span>CLEAN CODE 💎</span>
                    <button class="copy-small" data-target="code-output">Copy Code</button>
                </div>
                <div id="code-output" class="display-area">Kod akan muncul di sini...</div>
            </div>

            <div class="box">
                <div class="box-title">
                    <span>NORMAL TEXT 💬</span>
                    <button class="copy-small" data-target="text-output">Copy Text</button>
                </div>
                <div id="text-output" class="display-area text-mode">Teks akan muncul di sini...</div>
            </div>

            <div class="box full-width">
                <div class="box-title">
                    <span id="json-label">JSON MEGA REPAIR 📂</span>
                    <button class="copy-small" style="background: #27ae60;" data-target="json-output">Copy JSON</button>
                </div>
                <div id="json-output" class="display-area json-mode">Hasil repair JSON...</div>
            </div>
        </div>
    </div>
</div>

<script>
// Pastikan semua element dah ready
window.onload = function() {
    console.log("App Initialized...");
    document.getElementById('app-status').innerText = "System Active: v2.1 (Waiting for input)";

    // Ambil references
    const rawInput = document.getElementById('raw-input');
    const codeOut = document.getElementById('code-output');
    const textOut = document.getElementById('text-output');
    const jsonOut = document.getElementById('json-output');

    // 1. Fungsi Asingkan Kod
    document.getElementById('btn-process').addEventListener('click', function() {
        const val = rawInput.value.trim();
        if(!val) return alert("Paste dulu bro!");

        // Regex paling stabil untuk tangkap ```kod```
        const parts = val.split(/(```[\s\S]*?```)/g);
        let codes = [];
        let texts = [];

        parts.forEach(part => {
            if (part.startsWith('```')) {
                let clean = part.replace(/^```[a-zA-Z]*\n?/, '').replace(/```$/, '').trim();
                codes.push(clean);
            } else {
                if(part.trim()) texts.push(part.trim());
            }
        });

        codeOut.innerText = codes.length > 0 ? codes.join("\n\n/* --- NEXT BLOCK --- */\n\n") : "Tiada kod ditemui.";
        textOut.innerText = texts.length > 0 ? texts.join("\n\n") : "Tiada teks ditemui.";
        console.log("Separation done.");
    });

    // 2. Fungsi Repair JSON
    document.getElementById('btn-json').addEventListener('click', function() {
        const val = rawInput.value.trim();
        if(!val) return alert("Input kosong!");

        let clean = val.replace(/```[a-zA-Z]*\n?/g, '').replace(/```/g, '').trim();

        try {
            // Repair Logic
            let repaired = clean
                .replace(/\/\*[\s\S]*?\*\/|([^\\:]|^)\/\/.*$/gm, '$1')
                .replace(/['’‘]/g, '"')
                .replace(/,\s*([\]}])/g, '$1')
                .replace(/([{,]\s*)([a-zA-Z0-9_]+?)\s*:/g, '$1"$2":')
                .replace(/\}\s*\{/g, '},{');

            if (repaired.includes('},{') && !repaired.startsWith('[')) repaired = '[' + repaired + ']';

            const obj = JSON.parse(repaired);
            jsonOut.innerText = JSON.stringify(obj, null, 2);
            jsonOut.className = "display-area json-mode success-fix";
            document.getElementById('json-label').innerText = "JSON REPAIR: ✅ BERJAYA";
        } catch (e) {
            jsonOut.innerText = "Error: " + e.message;
            jsonOut.className = "display-area json-mode error-json";
            document.getElementById('json-label').innerText = "JSON REPAIR: ❌ GAGAL";
        }
    });

    // 3. Fungsi Salin (Copy)
    document.querySelectorAll('.copy-small, .btn-copy-raw').forEach(btn => {
        btn.addEventListener('click', function(e) {
            const targetId = this.getAttribute('data-target') || 'raw-input';
            const el = document.getElementById(targetId);
            const text = el.tagName === "TEXTAREA" ? el.value : el.innerText;

            if(!text || text.includes("muncul di sini")) return;

            const originalText = this.innerText;
            const self = this;

            // Fallback Copy
            const textArea = document.createElement("textarea");
            textArea.value = text;
            document.body.appendChild(textArea);
            textArea.select();
            try {
                document.execCommand('copy');
                self.innerText = "COPIED! ✅";
                self.style.background = "#2ecc71";
                setTimeout(() => { 
                    self.innerText = originalText; 
                    self.style.background = ""; 
                }, 1500);
            } catch (err) {
                alert("Gagal copy!");
            }
            document.body.removeChild(textArea);
        });
    });

    // 4. Padam Semua
    document.getElementById('btn-clear').addEventListener('click', function() {
        if(confirm("Padam semua data?")) location.reload();
    });
};
</script>
</body>
</html>
